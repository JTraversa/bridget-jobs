name: Refresh job board

# Re-runs the ATS sweep and commits jobs.json when the results change.
# Manual runs: Actions tab -> Refresh job board -> Run workflow.
on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC daily, ~7am ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # Workday tenants cap at 20 results/request and throttle paging

    # Job-level so the deploy step's `if` can see it. A step's own env block is
    # not in scope for that step's `if`, and `secrets` is never in scope there,
    # so checking it any other way silently evaluates to false and the step
    # never runs.
    env:
      HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record current job count
        id: before
        run: |
          echo "count=$(python -c "import json; print(len(json.load(open('jobs.json'))['jobs']))")" >> "$GITHUB_OUTPUT"

      - name: Run sweep
        working-directory: tools
        run: python sweep.py

      - name: Sanity check before committing
        env:
          BEFORE: ${{ steps.before.outputs.count }}
        run: |
          python - <<'PY'
          import json, os, sys

          before = int(os.environ["BEFORE"])
          data = json.load(open("jobs.json"))
          after = len(data["jobs"])
          print(f"jobs: {before} -> {after}  (swept {data['swept']} of {data['targets']} employers)")

          # A run where most feeds time out or start blocking the runner's IP would
          # otherwise commit a near-empty board over a good one. Refuse instead.
          if after < 40:
              sys.exit(f"refusing to commit: only {after} jobs, feeds probably failed")
          if before and after < before * 0.5:
              sys.exit(f"refusing to commit: {after} is less than half of {before}")
          if data["swept"] < data["targets"] * 0.5:
              sys.exit(f"refusing to commit: only {data['swept']} of {data['targets']} employers responded")
          PY

      # jobs.json carries a "generated" timestamp that changes on every run, so a
      # plain `git diff` is always dirty and would commit daily no-op churn.
      # Compare the actual content instead and discard a run that changed nothing.
      - name: Discard run if only the timestamp moved
        id: changed
        run: |
          python - <<'PY'
          import json, os, subprocess

          def meaningful(raw):
              d = json.loads(raw)
              d.pop("generated", None)
              return d

          new = meaningful(open("jobs.json", encoding="utf-8").read())
          old_raw = subprocess.run(["git", "show", "HEAD:jobs.json"],
                                   capture_output=True, text=True).stdout
          same = bool(old_raw) and meaningful(old_raw) == new

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"changed={'false' if same else 'true'}\n")
          print("no substantive change" if same else "board changed")
          PY
          if [ "$(git diff --quiet -- jobs.json; echo $?)" != "0" ] && \
             [ "${{ steps.changed.outputs.changed }}" = "false" ]; then
            git checkout -- jobs.json
          fi

      # og.png is deliberately NOT rebuilt here. Rendering it needs headless
      # Chrome on the runner, which is more fragility than a social card is
      # worth. Its counts drift from the board as a result; regenerate it by
      # hand with `node tools/build-og.mjs` when you care. The on-page hero
      # reads jobs.json live, so the site itself is always accurate.
      - name: Commit if changed
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "nothing staged"
          else
            git commit -m "Refresh job board ($(date -u +%Y-%m-%d))"
            git push
          fi

      # If the repo is linked to Vercel's GitHub integration, the push above already
      # triggers a deploy and this step is unnecessary. If you deploy with the CLI
      # instead, create a Vercel Deploy Hook and add it as the VERCEL_DEPLOY_HOOK
      # repository secret to enable this.
      - name: Trigger Vercel deploy
        if: env.HOOK != '' && steps.changed.outputs.changed == 'true'
        run: curl -fsSL -X POST "$HOOK"
